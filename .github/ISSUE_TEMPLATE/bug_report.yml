name: Bug report
description: Report a bridge or setup problem using sanitized details.
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, capability URLs, private deployment URLs, state files, or project prompts."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, IDE version, Go/Python versions, and native/openai mode.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized reproduction steps and whether this is a native session or cross-compilation.
    validations:
      required: true
